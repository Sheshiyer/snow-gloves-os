name: CI
on:
  push: { branches: [main] }
  pull_request: { branches: [main] }
jobs:
  lint-test-smoke:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with: { python-version: "3.12", cache: pip }
      - name: Install deps
        run: |
          python -m pip install --upgrade pip
          pip install pyyaml pytest
      - name: Doctor
        run: bash scripts/doctor.sh || true
      - name: Pytest
        run: pytest -q tests/
      - name: Version consistency
        run: python3 scripts/release.py --check
      - name: Catalog staleness
        run: |
          if [ -f scripts/build_catalog.py ]; then
            python3 scripts/build_catalog.py --check
          else
            echo "scripts/build_catalog.py not present; skipping"
          fi
      - name: Smoke (background hermes, e2e, embed stub, sentinel)
        env:
          SNOWGLOVES_EMBED_BACKEND: stub
        run: make smoke
