name: release
on:
  push:
    tags: ["v*"]
  workflow_dispatch:
    inputs:
      tag:
        description: "Tag to publish (e.g. v0.1.0). Leave empty when triggered by push."
        required: false

permissions:
  contents: write

jobs:
  prepare:
    name: prepare-release
    runs-on: ubuntu-latest
    permissions:
      contents: write
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}
      - name: Ensure draft GitHub Release exists
        run: |
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "release $TAG already exists"
          else
            gh release create "$TAG" --draft --verify-tag \
              --title "Snow Gloves OS $TAG" \
              --notes "Stable $TAG. User guide: https://snow-gloves-wiki.vercel.app — catalog: https://sheshiyer.github.io/snow-gloves-os/ — 0.1.x must reinstall."
          fi

  build:
    name: ${{ matrix.platform }}
    needs: prepare
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: macos-latest
            args: --target universal-apple-darwin
            rust-targets: aarch64-apple-darwin,x86_64-apple-darwin
          - platform: ubuntu-22.04
            args: ""
            rust-targets: ""
          - platform: windows-latest
            args: ""
            rust-targets: ""

    runs-on: ${{ matrix.platform }}
    defaults:
      run:
        working-directory: apps/onboarding

    steps:
      - uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: apps/onboarding/package-lock.json

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: ${{ matrix.rust-targets }}

      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: apps/onboarding/src-tauri -> target

      - name: Install Linux deps
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            libssl-dev \
            build-essential

      - name: Import Apple Developer ID cert (macOS)
        id: apple
        if: matrix.platform == 'macos-latest'
        env:
          APPLE_CERTIFICATE: ${{ secrets.APPLE_CERTIFICATE }}
          APPLE_CERTIFICATE_PASSWORD: ${{ secrets.APPLE_CERTIFICATE_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ secrets.KEYCHAIN_PASSWORD }}
        run: |
          if [ -z "$APPLE_CERTIFICATE" ]; then
            echo "::warning::APPLE_CERTIFICATE not set — macOS build will be unsigned"
            echo "skip_notarize=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          echo "skip_notarize=false" >> "$GITHUB_OUTPUT"
          echo "$APPLE_CERTIFICATE" | base64 --decode > /tmp/cert.p12
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain
          security import /tmp/cert.p12 -k build.keychain \
            -P "$APPLE_CERTIFICATE_PASSWORD" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list -S apple-tool:,apple:,codesign: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null
          security find-identity -v -p codesigning build.keychain
          rm /tmp/cert.p12

      - name: Install frontend deps
        run: npm ci

      - name: Build, sign, notarize, publish
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
          APPLE_SIGNING_IDENTITY: ${{ steps.apple.outputs.skip_notarize == 'true' && '' || secrets.APPLE_SIGNING_IDENTITY }}
          APPLE_ID: ${{ steps.apple.outputs.skip_notarize == 'true' && '' || secrets.APPLE_ID }}
          APPLE_PASSWORD: ${{ steps.apple.outputs.skip_notarize == 'true' && '' || secrets.APPLE_PASSWORD }}
          APPLE_TEAM_ID: ${{ steps.apple.outputs.skip_notarize == 'true' && '' || secrets.APPLE_TEAM_ID }}
        with:
          projectPath: apps/onboarding
          tagName: ${{ github.event.inputs.tag || github.ref_name }}
          releaseName: "Snow Gloves OS ${{ github.event.inputs.tag || github.ref_name }}"
          releaseBody: |
            ## Snow Gloves OS ${{ github.event.inputs.tag || github.ref_name }}

            Stable platform + onboarding app. User guide: [snow-gloves-wiki](https://snow-gloves-wiki.vercel.app). Catalog dashboard: https://sheshiyer.github.io/snow-gloves-os/

            **macOS:** open the `.dmg`, drag to Applications.
            **Windows:** run the `.msi` or `.exe` installer.
            **Linux:** install the `.deb`, `.rpm`, or use the AppImage.

            **0.1.x users must reinstall.** Bundle id `com.tryambakam.snowgloves.onboarding` is a new app; OTA from 0.1.x will not find this release.

            Core routing is native `snowgloves:` skills only. inference-sh and Explee are optional catalog packs.

            Changelog: [CHANGELOG.md](https://github.com/Sheshiyer/snow-gloves-os/blob/main/CHANGELOG.md).
          releaseDraft: true
          prerelease: false
          includeUpdaterJson: true
          args: ${{ matrix.args }}

  # Platform assets: source tarball, catalog/modules.json, adapter bundle.
  # Runs after the app matrix (success or not) so it attaches to the draft
  # release tauri-action created instead of racing it; needs no Apple secrets.
  platform:
    name: platform
    needs: build
    if: ${{ always() }}
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.inputs.tag || github.ref_name }}
      GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag || github.ref }}

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: requirements-ci.txt

      - name: Install deps
        run: pip install -r requirements-ci.txt

      - name: Verify VERSION matches tag
        run: python3 scripts/release.py --check --expect "$TAG"

      - name: Build catalog
        run: |
          if [ -f scripts/build_catalog.py ]; then
            python3 scripts/build_catalog.py
          else
            echo "::warning::scripts/build_catalog.py missing — modules.json not rebuilt"
          fi

      - name: Bundle platform assets
        run: python3 scripts/release.py --bundle dist

      - name: Attach to GitHub release
        run: |
          if ! gh release view "$TAG" >/dev/null 2>&1; then
            gh release create "$TAG" --draft --verify-tag \
              --title "Snow Gloves OS $TAG" \
              --notes "Platform release $TAG. See [CHANGELOG](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)."
          fi
          gh release upload "$TAG" dist/* --clobber
