# Snow Gloves OS — runtime config
platform:
  name: snow-gloves-os
  version: 0.2.1

paperclip:
  # PLACEHOLDER (P-SEC-a2): future TN-owned paperclip instance. Not yet stood up —
  # phase T5 recreates the TRY company there. Override at runtime via
  # PAPERCLIP_HOST / PAPERCLIP_PORT env (see scripts/paperclip_bridge.py).
  host: paperclip.tn.local
  port: 3100
  instance: tn

hermes:
  host: 127.0.0.1
  port: 4100
  channel: snowgloves.events.v1

embeddings:
  provider: nvidia
  model: nv-embedqa-e5-v5
  dimension: 1024

connectors:
  fabric: g-stack
  scope_mode: least-privilege
  approval_required:
    - finance.write
    - hr.write
    - legal.write

retrieval:
  index: vector
  per_tenant_isolation: true

audit:
  enabled: true
  sink: ./_audit/trace.log
